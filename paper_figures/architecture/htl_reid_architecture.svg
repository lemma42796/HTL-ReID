<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1900" height="820" viewBox="0 0 1900 820">
<title>Final architecture of HTL-ReID</title>
<desc>Compact E060 architecture: shared ViT, HS, main selector branch, gradient-isolated ACI, three-stripe part branch, and the final 11520-dimensional descriptor.</desc>
<defs>
 <style>
 text{font-family:"Times New Roman",Times,serif;fill:#222}.mt{font-size:25px;font-weight:700}.st{font-size:18px;font-weight:700}.lb{font-size:16px;font-weight:700}.tx{font-size:14px}.sm{font-size:12px}.tn{font-size:10.5px}
 .grp{fill:#fff;stroke:#666;stroke-width:1.7;stroke-dasharray:8 6}.neu{fill:#f3f3f3;stroke:#777;stroke-width:1.35}.r{fill:#ddeed7;stroke:#72a866;stroke-width:1.5}.n{fill:#dfeaf6;stroke:#6d98c5;stroke-width:1.5}.t{fill:#f6dcd8;stroke:#d47469;stroke-width:1.5}.h{fill:#e9ddf0;stroke:#9272a1;stroke-width:1.5}.sel{fill:#fff49a;stroke:#d8be22;stroke-width:1.5}.exp{fill:#f9e7b7;stroke:#d3a646;stroke-width:1.35}.w{fill:#fff;stroke:#777;stroke-width:1.25}
 .f{fill:none;stroke:#222;stroke-width:1.7;marker-end:url(#a)}.th{fill:none;stroke:#444;stroke-width:1.2;marker-end:url(#as)}.mf{fill:none;stroke:#9272a1;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#ap)}.sg{fill:none;stroke:#777;stroke-width:1.7;stroke-dasharray:4 3}.rl{fill:none;stroke:#72a866;stroke-width:1.7;marker-end:url(#ar)}.nl{fill:none;stroke:#6d98c5;stroke-width:1.7;marker-end:url(#an)}.tl{fill:none;stroke:#d47469;stroke-width:1.7;marker-end:url(#at)}.mut{fill:#777}
 </style>
 <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#222"/></marker>
 <marker id="as" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#444"/></marker>
 <marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#9272a1"/></marker>
 <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#72a866"/></marker>
 <marker id="an" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#6d98c5"/></marker>
 <marker id="at" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#d47469"/></marker>
 <g id="grid"><rect width="34" height="34" fill="#fff" stroke="#777"/><path d="M11.3 0V34M22.7 0V34M0 11.3H34M0 22.7H34" stroke="#aaa" stroke-width=".8"/></g>
 <g id="sgrid"><use xlink:href="#grid"/><rect x="1" y="1" width="10" height="10" class="sel"/><rect x="23" y="1" width="10" height="10" class="sel"/><rect x="12" y="12" width="10" height="10" class="sel"/><rect x="1" y="23" width="10" height="10" class="sel"/></g>
 <g id="facrStage"><rect width="170" height="150" rx="3" class="w"/><circle cx="43" cy="64" r="17" class="r"/><text x="43" y="69" text-anchor="middle" class="lb">R</text><circle cx="127" cy="64" r="17" class="n"/><text x="127" y="69" text-anchor="middle" class="lb">N</text><circle cx="85" cy="113" r="17" class="t"/><text x="85" y="118" text-anchor="middle" class="lb">T</text><path d="M61 64H108" class="rl"/><path d="M117 79L97 98" class="nl"/><path d="M73 98L53 79" class="tl"/><text x="85" y="140" text-anchor="middle" class="tn">adaptive route + gated residual</text></g>
</defs>
<rect width="1900" height="820" fill="#fff"/>

<!-- Original color legend -->
<g transform="translate(25 18)"><rect width="18" height="12" class="r"/><text x="24" y="11" class="sm">RGB</text><rect x="74" width="18" height="12" class="n"/><text x="98" y="11" class="sm">NIR</text><rect x="147" width="18" height="12" class="t"/><text x="171" y="11" class="sm">TIR</text><rect x="218" width="18" height="12" class="h"/><text x="242" y="11" class="sm">selection</text><rect x="326" width="18" height="12" class="sel"/><text x="350" y="11" class="sm">selected token / union</text><rect x="499" width="18" height="12" class="exp"/><text x="523" y="11" class="sm">gate / branch head</text><path d="M655 6H692" class="mf"/><text x="700" y="11" class="sm">HS-mask constraint</text><path d="M835 0V14" class="sg"/><text x="846" y="11" class="sm">stop-gradient</text></g>

<!-- Inputs -->
<g><text x="72" y="62" text-anchor="middle" class="st">Input</text>
 <image x="23" y="78" width="98" height="188" preserveAspectRatio="xMidYMid slice" xlink:href="input_rgb.png"/><rect x="23" y="78" width="98" height="188" fill="none" stroke="#72a866" stroke-width="3"/><text x="72" y="287" text-anchor="middle" class="lb" fill="#548a4b">RGB</text>
 <image x="23" y="318" width="98" height="188" preserveAspectRatio="xMidYMid slice" xlink:href="input_nir.png"/><rect x="23" y="318" width="98" height="188" fill="none" stroke="#6d98c5" stroke-width="3"/><text x="72" y="527" text-anchor="middle" class="lb" fill="#527ca7">NIR</text>
 <image x="23" y="558" width="98" height="188" preserveAspectRatio="xMidYMid slice" xlink:href="input_tir.png"/><rect x="23" y="558" width="98" height="188" fill="none" stroke="#d47469" stroke-width="3"/><text x="72" y="767" text-anchor="middle" class="lb" fill="#bd5e54">TIR</text>
</g>

<!-- Shared backbone, same framing as the original figure -->
<g><rect x="154" y="58" width="205" height="724" rx="4" class="grp"/><text x="256" y="88" text-anchor="middle" class="st">Shared ViT-B/16</text><text x="256" y="107" text-anchor="middle" class="sm">ImageNet init. · weight sharing</text>
 <path d="M121 174H174" class="rl"/><path d="M121 414H174" class="nl"/><path d="M121 654H174" class="tl"/>
 <g transform="translate(176 126)"><rect width="160" height="124" rx="3" class="r"/><text x="80" y="27" text-anchor="middle" class="lb">Patch Embedding</text><path d="M12 42H148" stroke="#8fb987"/><text x="80" y="68" text-anchor="middle" class="lb">Transformer × 12</text><text x="80" y="90" text-anchor="middle" class="sm">[CLS] + 128 patches</text><use xlink:href="#grid" x="63" y="136"/></g>
 <g transform="translate(176 366)"><rect width="160" height="124" rx="3" class="n"/><text x="80" y="27" text-anchor="middle" class="lb">Patch Embedding</text><path d="M12 42H148" stroke="#8eb0d3"/><text x="80" y="68" text-anchor="middle" class="lb">Transformer × 12</text><text x="80" y="90" text-anchor="middle" class="sm">[CLS] + 128 patches</text><use xlink:href="#grid" x="63" y="136"/></g>
 <g transform="translate(176 606)"><rect width="160" height="124" rx="3" class="t"/><text x="80" y="27" text-anchor="middle" class="lb">Patch Embedding</text><path d="M12 42H148" stroke="#dfa29b"/><text x="80" y="68" text-anchor="middle" class="lb">Transformer × 12</text><text x="80" y="90" text-anchor="middle" class="sm">[CLS] + 128 patches</text><use xlink:href="#grid" x="63" y="136"/></g>
</g>

<!-- HS -->
<g><rect x="392" y="58" width="346" height="306" rx="4" class="grp"/><text x="565" y="88" text-anchor="middle" class="mt">HS</text><text x="565" y="108" text-anchor="middle" class="sm">complete token selection</text>
 <path d="M359 166H414M359 276H414" class="f"/><rect x="414" y="128" width="138" height="70" rx="3" class="h"/><text x="483" y="155" text-anchor="middle" class="lb">Attention Rollout</text><text x="483" y="176" text-anchor="middle" class="sm">head-wise Top-1 union</text><rect x="414" y="238" width="138" height="70" rx="3" class="h"/><text x="483" y="265" text-anchor="middle" class="lb">Frequency Mask</text><text x="483" y="286" text-anchor="middle" class="sm">Haar DWT · Top-10</text>
 <path d="M552 163H592V192M552 273H592V242" class="th"/><circle cx="592" cy="217" r="25" class="sel"/><text x="592" y="222" text-anchor="middle" class="lb">OR</text><path d="M617 217H651" class="f"/><use xlink:href="#sgrid" x="659" y="200"/><text x="676" y="252" text-anchor="middle" class="sm">shared hard mask</text><text x="565" y="340" text-anchor="middle" class="sm">rollout + frequency evidence → selected patches</text>
</g>

<!-- Main selector branch occupying the original top-right block -->
<g><rect x="768" y="58" width="726" height="306" rx="4" class="grp"/><text x="1131" y="88" text-anchor="middle" class="mt">Main Selector Branch</text><text x="1131" y="108" text-anchor="middle" class="sm">HS-selected evidence directly forms the primary retrieval representation</text>
 <path d="M693 217V120H828" class="mf"/>
 <g transform="translate(798 132)"><rect width="190" height="178" rx="3" class="w"/><text x="95" y="26" text-anchor="middle" class="lb">Shared Masking</text><g transform="translate(23 52)"><rect width="38" height="30" class="r"/><text x="19" y="20" text-anchor="middle" class="sm">RGB</text><use xlink:href="#sgrid" x="95" y="-2"/><rect y="42" width="38" height="30" class="n"/><text x="19" y="62" text-anchor="middle" class="sm">NIR</text><use xlink:href="#sgrid" x="95" y="40"/><rect y="84" width="38" height="30" class="t"/><text x="19" y="104" text-anchor="middle" class="sm">TIR</text><use xlink:href="#sgrid" x="95" y="82"/><path d="M42 15H89M42 57H89M42 99H89" class="th"/></g></g>
 <path d="M988 221H1019" class="f"/>
 <g transform="translate(1020 132)"><rect width="190" height="178" rx="3" class="w"/><text x="95" y="28" text-anchor="middle" class="lb">Selected Context</text><circle cx="95" cy="78" r="28" class="sel"/><text x="95" y="75" text-anchor="middle" class="lb">CLS</text><text x="95" y="92" text-anchor="middle" class="tn">per modality</text><path d="M95 108V125" class="th"/><rect x="28" y="127" width="134" height="30" rx="15" class="h"/><text x="95" y="147" text-anchor="middle" class="sm">CLS + 0.15 × patch mean</text></g>
 <path d="M1210 221H1241" class="f"/>
 <g transform="translate(1242 132)"><rect width="190" height="178" rx="3" class="w"/><text x="95" y="28" text-anchor="middle" class="lb">Main Descriptor</text><rect x="24" y="50" width="142" height="45" rx="3" class="neu"/><text x="95" y="70" text-anchor="middle" class="sm">Concat. R / N / T</text><text x="95" y="87" text-anchor="middle" class="sm">BNNeck + classifier</text><path d="M95 95V114" class="th"/><rect x="30" y="116" width="130" height="36" rx="18" class="neu"/><text x="95" y="139" text-anchor="middle" class="lb">2304-D</text><text x="95" y="168" text-anchor="middle" class="tn">CE + triplet · loss × 1.00</text></g>
 <path d="M1432 221H1475" class="f"/><text x="1465" y="211" class="tn">z<tspan baseline-shift="sub">main</tspan></text>
</g>

<!-- Complete-token bus between rows -->
<path d="M359 384H824" fill="none" stroke="#222" stroke-width="1.7"/><text x="586" y="379" text-anchor="middle" class="sm">complete RGB / NIR / TIR token bus</text>

<!-- Three-stripe part branch -->
<g><rect x="392" y="402" width="424" height="380" rx="4" class="grp"/><text x="604" y="432" text-anchor="middle" class="mt">Three-Stripe Part Branch</text><text x="604" y="452" text-anchor="middle" class="sm">coarse local representation from HS-masked patches</text><path d="M693 234V384H424V485" class="mf"/>
 <g transform="translate(425 478)"><text y="26" class="lb" fill="#548a4b">RGB</text><use xlink:href="#sgrid" x="51" y="2"/><path d="M93 19H123" class="th"/><g class="r"><rect x="124" width="42" height="12"/><rect x="124" y="14" width="42" height="12"/><rect x="124" y="28" width="42" height="12"/></g><text x="145" y="58" text-anchor="middle" class="tn">3 stripes</text><path d="M168 20H204" class="th"/><rect x="205" y="5" width="108" height="30" class="r"/><text x="259" y="25" text-anchor="middle" class="sm">stripe features</text></g>
 <g transform="translate(425 568)"><text y="26" class="lb" fill="#527ca7">NIR</text><use xlink:href="#sgrid" x="51" y="2"/><path d="M93 19H123" class="th"/><g class="n"><rect x="124" width="42" height="12"/><rect x="124" y="14" width="42" height="12"/><rect x="124" y="28" width="42" height="12"/></g><text x="145" y="58" text-anchor="middle" class="tn">3 stripes</text><path d="M168 20H204" class="th"/><rect x="205" y="5" width="108" height="30" class="n"/><text x="259" y="25" text-anchor="middle" class="sm">stripe features</text></g>
 <g transform="translate(425 658)"><text y="26" class="lb" fill="#bd5e54">TIR</text><use xlink:href="#sgrid" x="51" y="2"/><path d="M93 19H123" class="th"/><g class="t"><rect x="124" width="42" height="12"/><rect x="124" y="14" width="42" height="12"/><rect x="124" y="28" width="42" height="12"/></g><text x="145" y="58" text-anchor="middle" class="tn">3 stripes</text><path d="M168 20H204" class="th"/><rect x="205" y="5" width="108" height="30" class="t"/><text x="259" y="25" text-anchor="middle" class="sm">stripe features</text></g>
 <path d="M738 498H776V687M738 588H776M738 678H776" class="th"/><circle cx="776" cy="715" r="20" class="w"/><text x="776" y="720" text-anchor="middle" class="lb">C</text><text x="776" y="748" text-anchor="middle" class="sm">6912-D</text><text x="604" y="767" text-anchor="middle" class="tn">3 modalities × 3 stripes × 768 · loss × 0.15</text>
</g>

<!-- Gradient-isolated ACI in the lower interaction position -->
<g><rect x="846" y="402" width="648" height="380" rx="4" class="grp"/><text x="1170" y="432" text-anchor="middle" class="mt">Gradient-Isolated ACI</text><text x="1170" y="452" text-anchor="middle" class="sm">three-stage mask-constrained adaptive cross-modal interaction</text>
 <path d="M824 384V570H848" class="f"/><circle cx="873" cy="570" r="21" class="w"/><path d="M873 543V597" class="sg"/><text x="873" y="567" text-anchor="middle" class="lb">SG</text><text x="873" y="583" text-anchor="middle" class="tn">detach</text><path d="M894 570H909" class="f"/>
 <path d="M693 235V384H996V481" class="mf"/><text x="960" y="475" class="tn">hard mask</text>
 <g transform="translate(910 492)"><use xlink:href="#facrStage"/><text x="85" y="24" text-anchor="middle" class="lb">Stage 1</text></g><path d="M1080 567H1099" class="f"/>
 <g transform="translate(1100 492)"><use xlink:href="#facrStage"/><text x="85" y="24" text-anchor="middle" class="lb">Stage 2</text></g><path d="M1270 567H1289" class="f"/>
 <g transform="translate(1290 492)"><use xlink:href="#facrStage"/><text x="85" y="24" text-anchor="middle" class="lb">Stage 3</text></g>
 <path d="M1375 642V666" class="th"/><rect x="1088" y="667" width="332" height="60" rx="3" class="exp"/><text x="1254" y="691" text-anchor="middle" class="lb">Independent BNNeck + classifier</text><text x="1254" y="712" text-anchor="middle" class="sm">2304-D · branch loss × 0.50</text><path d="M1420 697H1475" class="f"/><text x="1438" y="687" class="tn">z<tspan baseline-shift="sub">aci</tspan></text><text x="1170" y="760" text-anchor="middle" class="sm mut">ACI gradients cannot alter the shared backbone or main selector branch</text>
</g>

<!-- Final descriptor, same compact vertical structure as the original -->
<g><rect x="1530" y="402" width="346" height="380" rx="4" class="grp"/><text x="1703" y="432" text-anchor="middle" class="mt">Final Descriptor</text><text x="1703" y="452" text-anchor="middle" class="sm">branch norm. → fixed weight → concatenate</text>
 <path d="M1494 221H1518V493H1560" class="f"/><rect x="1560" y="468" width="198" height="50" class="neu"/><text x="1576" y="490" class="lb">Main selector</text><text x="1576" y="508" class="sm">2304-D</text><text x="1738" y="498" text-anchor="end" class="lb">× 1.00</text>
 <path d="M1475 697H1518V561H1560" class="f"/><rect x="1560" y="536" width="198" height="50" class="neu"/><text x="1576" y="558" class="lb">Isolated ACI</text><text x="1576" y="576" class="sm">2304-D</text><text x="1738" y="566" text-anchor="end" class="lb">× 0.25</text>
 <path d="M796 715H826V795H1518V629H1560" class="f"/><rect x="1560" y="604" width="198" height="50" class="neu"/><text x="1576" y="626" class="lb">Three-stripe part</text><text x="1576" y="644" class="sm">6912-D</text><text x="1738" y="634" text-anchor="end" class="lb">× 0.30</text>
 <path d="M1758 493H1801V654M1758 561H1801M1758 629H1801" class="th"/><circle cx="1801" cy="682" r="25" class="w"/><text x="1801" y="688" text-anchor="middle" class="lb">C</text><path d="M1801 707V724" class="f"/><rect x="1588" y="726" width="238" height="40" rx="20" class="w"/><text x="1707" y="746" text-anchor="middle" class="lb">11,520-D retrieval descriptor</text><text x="1707" y="761" text-anchor="middle" class="tn">single view · no TTA · no re-ranking</text>
</g>
</svg>
