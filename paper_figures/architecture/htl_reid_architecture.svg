<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1900" height="1060" viewBox="0 0 1900 1060">
<title>Final architecture of HTL-ReID</title>
<desc>Frozen E060 architecture with shared ViT encoding, hierarchical selection, a main selector descriptor, a gradient-isolated FACR branch, a three-stripe part branch, and an 11520-dimensional retrieval descriptor.</desc>
<defs>
  <style>
    text{font-family:"Times New Roman",Times,serif;fill:#20242a}
    .title{font-size:27px;font-weight:700}.head{font-size:22px;font-weight:700}.subhead{font-size:17px;font-weight:700}
    .label{font-size:15px;font-weight:700}.body{font-size:14px}.small{font-size:12px}.tiny{font-size:10.5px}
    .group{fill:#fff;stroke:#59636f;stroke-width:1.7;stroke-dasharray:8 6}.neutral{fill:#f3f5f7;stroke:#7a838d;stroke-width:1.35}
    .rgb{fill:#deefd8;stroke:#66a05d;stroke-width:1.5}.nir{fill:#dceaf7;stroke:#618fc0;stroke-width:1.5}.tir{fill:#f7ddd9;stroke:#cf6b61;stroke-width:1.5}
    .select{fill:#ece0f2;stroke:#8f6ea0;stroke-width:1.5}.chosen{fill:#fff4a3;stroke:#d2b91f;stroke-width:1.5}
    .facr{fill:#f7e8bf;stroke:#c79736;stroke-width:1.5}.part{fill:#dff1ee;stroke:#4f9b90;stroke-width:1.5}.output{fill:#e7edf4;stroke:#657c94;stroke-width:1.5}
    .arrow{fill:none;stroke:#28313a;stroke-width:1.8;marker-end:url(#arrow)}.thin{fill:none;stroke:#4b5560;stroke-width:1.25;marker-end:url(#smallArrow)}
    .rgbLine{fill:none;stroke:#66a05d;stroke-width:1.7;marker-end:url(#rgbArrow)}.nirLine{fill:none;stroke:#618fc0;stroke-width:1.7;marker-end:url(#nirArrow)}
    .tirLine{fill:none;stroke:#cf6b61;stroke-width:1.7;marker-end:url(#tirArrow)}.maskLine{fill:none;stroke:#8f6ea0;stroke-width:1.6;stroke-dasharray:5 4;marker-end:url(#maskArrow)}
    .stopLine{fill:none;stroke:#bd4d4d;stroke-width:2.2;stroke-dasharray:5 4}.muted{fill:#66717d}
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#28313a"/></marker>
  <marker id="smallArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#4b5560"/></marker>
  <marker id="rgbArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#66a05d"/></marker>
  <marker id="nirArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#618fc0"/></marker>
  <marker id="tirArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#cf6b61"/></marker>
  <marker id="maskArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#8f6ea0"/></marker>
  <g id="tokenStrip">
    <rect width="18" height="18" rx="2" class="chosen"/><rect x="22" width="18" height="18" rx="2" class="neutral"/><rect x="44" width="18" height="18" rx="2" class="neutral"/>
    <rect x="66" width="18" height="18" rx="2" class="neutral"/><rect x="88" width="18" height="18" rx="2" class="neutral"/><rect x="110" width="18" height="18" rx="2" class="neutral"/>
  </g>
  <g id="maskGrid">
    <rect width="72" height="48" fill="#fff" stroke="#7b8490"/><path d="M18 0V48M36 0V48M54 0V48M0 16H72M0 32H72" stroke="#a9b0b8" stroke-width=".8"/>
    <rect x="1" y="1" width="16" height="14" class="chosen"/><rect x="37" y="1" width="16" height="14" class="chosen"/>
    <rect x="19" y="17" width="16" height="14" class="chosen"/><rect x="55" y="33" width="16" height="14" class="chosen"/>
  </g>
  <g id="routingStage">
    <rect width="170" height="150" rx="4" class="facr"/>
    <circle cx="45" cy="62" r="17" class="rgb"/><text x="45" y="67" text-anchor="middle" class="label">R</text>
    <circle cx="125" cy="62" r="17" class="nir"/><text x="125" y="67" text-anchor="middle" class="label">N</text>
    <circle cx="85" cy="113" r="17" class="tir"/><text x="85" y="118" text-anchor="middle" class="label">T</text>
    <path d="M63 62H106" class="rgbLine"/><path d="M116 77L97 98" class="nirLine"/><path d="M73 98L54 77" class="tirLine"/>
    <text x="85" y="140" text-anchor="middle" class="tiny">adaptive routes + gated residual</text>
  </g>
</defs>

<rect width="1900" height="1060" fill="#fff"/>

<!-- legend -->
<g transform="translate(24 17)">
  <rect width="18" height="12" class="rgb"/><text x="25" y="11" class="small">RGB</text>
  <rect x="77" width="18" height="12" class="nir"/><text x="102" y="11" class="small">NIR</text>
  <rect x="150" width="18" height="12" class="tir"/><text x="175" y="11" class="small">TIR</text>
  <rect x="223" width="18" height="12" class="select"/><text x="248" y="11" class="small">selection / mask</text>
  <rect x="372" width="18" height="12" class="facr"/><text x="397" y="11" class="small">FACR</text>
  <rect x="455" width="18" height="12" class="part"/><text x="480" y="11" class="small">part branch</text>
  <path d="M580 6H620" class="maskLine"/><text x="630" y="11" class="small">hard-mask constraint</text>
  <line x1="785" y1="0" x2="785" y2="14" class="stopLine"/><text x="795" y="11" class="small">stop-gradient boundary</text>
</g>

<!-- aligned inputs -->
<g>
  <text x="73" y="67" text-anchor="middle" class="subhead">Aligned Inputs</text>
  <image x="24" y="94" width="98" height="164" preserveAspectRatio="xMidYMid slice" xlink:href="input_rgb.png"/>
  <rect x="24" y="94" width="98" height="164" fill="none" stroke="#66a05d" stroke-width="3"/><text x="73" y="280" text-anchor="middle" class="label">RGB</text>
  <image x="24" y="354" width="98" height="164" preserveAspectRatio="xMidYMid slice" xlink:href="input_nir.png"/>
  <rect x="24" y="354" width="98" height="164" fill="none" stroke="#618fc0" stroke-width="3"/><text x="73" y="540" text-anchor="middle" class="label">NIR</text>
  <image x="24" y="614" width="98" height="164" preserveAspectRatio="xMidYMid slice" xlink:href="input_tir.png"/>
  <rect x="24" y="614" width="98" height="164" fill="none" stroke="#cf6b61" stroke-width="3"/><text x="73" y="800" text-anchor="middle" class="label">TIR</text>
</g>

<!-- shared backbone -->
<g>
  <rect x="154" y="58" width="252" height="790" rx="5" class="group"/>
  <text x="280" y="88" text-anchor="middle" class="head">Shared ViT-B/16</text>
  <text x="280" y="108" text-anchor="middle" class="small">ImageNet initialization · shared parameters</text>
  <path d="M122 176H180" class="rgbLine"/><path d="M122 436H180" class="nirLine"/><path d="M122 696H180" class="tirLine"/>

  <g transform="translate(180 130)">
    <rect width="200" height="105" rx="4" class="rgb"/><text x="100" y="29" text-anchor="middle" class="label">RGB patch embedding</text>
    <path d="M18 43H182" stroke="#91b78a"/><text x="100" y="67" text-anchor="middle" class="label">Transformer × 12</text><text x="100" y="89" text-anchor="middle" class="small">[CLS] + 128 patch tokens</text>
    <use xlink:href="#tokenStrip" x="36" y="119"/><text x="100" y="160" text-anchor="middle" class="small">tokens + attention maps</text>
  </g>
  <g transform="translate(180 390)">
    <rect width="200" height="105" rx="4" class="nir"/><text x="100" y="29" text-anchor="middle" class="label">NIR patch embedding</text>
    <path d="M18 43H182" stroke="#8eb0d3"/><text x="100" y="67" text-anchor="middle" class="label">Transformer × 12</text><text x="100" y="89" text-anchor="middle" class="small">[CLS] + 128 patch tokens</text>
    <use xlink:href="#tokenStrip" x="36" y="119"/><text x="100" y="160" text-anchor="middle" class="small">tokens + attention maps</text>
  </g>
  <g transform="translate(180 650)">
    <rect width="200" height="105" rx="4" class="tir"/><text x="100" y="29" text-anchor="middle" class="label">TIR patch embedding</text>
    <path d="M18 43H182" stroke="#dfa29b"/><text x="100" y="67" text-anchor="middle" class="label">Transformer × 12</text><text x="100" y="89" text-anchor="middle" class="small">[CLS] + 128 patch tokens</text>
    <use xlink:href="#tokenStrip" x="36" y="119"/><text x="100" y="160" text-anchor="middle" class="small">tokens + attention maps</text>
  </g>
</g>

<!-- shared complete-token bus -->
<path d="M380 258H420M380 518H420M380 778H420M420 258V778" fill="none" stroke="#39434d" stroke-width="1.6"/>
<text x="416" y="833" text-anchor="middle" class="tiny">complete token bus</text>

<!-- HS -->
<g>
  <rect x="442" y="58" width="330" height="270" rx="5" class="group"/>
  <text x="607" y="87" text-anchor="middle" class="title">HS</text>
  <text x="607" y="108" text-anchor="middle" class="small">hierarchical selection with frequency evidence</text>
  <path d="M420 258H466V158" class="arrow"/>
  <rect x="466" y="128" width="126" height="66" rx="4" class="select"/>
  <text x="529" y="151" text-anchor="middle" class="label">Attention rollout</text><text x="529" y="171" text-anchor="middle" class="small">Top-1 / head, union</text>
  <rect x="466" y="218" width="126" height="66" rx="4" class="select"/>
  <text x="529" y="241" text-anchor="middle" class="label">Frequency prior</text><text x="529" y="261" text-anchor="middle" class="small">Haar DWT, Top-10</text>
  <path d="M592 161H623V191M592 251H623V221" class="thin"/>
  <circle cx="623" cy="206" r="24" class="chosen"/><text x="623" y="212" text-anchor="middle" class="label">OR</text>
  <path d="M647 206H672" class="arrow"/><use xlink:href="#maskGrid" x="680" y="182"/>
  <text x="716" y="250" text-anchor="middle" class="small">shared hard mask</text>
  <text x="607" y="309" text-anchor="middle" class="small">same selected locations applied to RGB, NIR, and TIR</text>
</g>

<!-- main selector branch -->
<g>
  <rect x="820" y="58" width="410" height="270" rx="5" class="group"/>
  <text x="1025" y="87" text-anchor="middle" class="head">Main Selector Branch</text>
  <text x="1025" y="108" text-anchor="middle" class="small">directly trains the primary retrieval representation</text>
  <path d="M772 206H805V153H842" class="maskLine"/>
  <path d="M420 258V340H790V133H842" class="arrow"/>
  <rect x="842" y="124" width="156" height="83" rx="4" class="select"/>
  <text x="920" y="148" text-anchor="middle" class="label">Mask selected patches</text>
  <text x="920" y="169" text-anchor="middle" class="small">per modality</text><text x="920" y="188" text-anchor="middle" class="small">CLS + 0.15 × patch mean</text>
  <path d="M998 166H1027" class="arrow"/>
  <rect x="1028" y="124" width="178" height="83" rx="4" class="neutral"/>
  <text x="1117" y="149" text-anchor="middle" class="label">Concatenate R / N / T</text>
  <text x="1117" y="170" text-anchor="middle" class="small">BNNeck + classifier</text><text x="1117" y="190" text-anchor="middle" class="small">CE + triplet supervision</text>
  <rect x="911" y="235" width="228" height="52" rx="26" class="output"/>
  <text x="1025" y="258" text-anchor="middle" class="label">Main descriptor z<tspan baseline-shift="sub" font-size="11">main</tspan></text>
  <text x="1025" y="278" text-anchor="middle" class="small">3 × 768 = 2304-D · loss × 1.00</text>
  <path d="M1117 207V230" class="thin"/>
</g>

<!-- gradient-isolated FACR -->
<g>
  <rect x="820" y="360" width="690" height="390" rx="5" class="group"/>
  <text x="1165" y="389" text-anchor="middle" class="head">Gradient-Isolated FACR</text>
  <text x="1165" y="410" text-anchor="middle" class="small">mask-constrained adaptive cross-modal routing on complete tokens</text>
  <path d="M420 518H785V458H842" class="arrow"/>
  <line x1="864" y1="430" x2="864" y2="492" class="stopLine"/>
  <circle cx="864" cy="461" r="24" fill="#fff" stroke="#bd4d4d" stroke-width="1.8"/><text x="864" y="457" text-anchor="middle" class="label" fill="#a63f3f">SG</text><text x="864" y="474" text-anchor="middle" class="tiny" fill="#a63f3f">detach</text>
  <path d="M772 206H794V426H932V449" class="maskLine"/>
  <text x="923" y="431" text-anchor="middle" class="tiny">HS hard mask</text>

  <g transform="translate(900 460)"><use xlink:href="#routingStage"/><text x="85" y="25" text-anchor="middle" class="label">Stage 1</text></g>
  <path d="M1070 535H1093" class="arrow"/>
  <g transform="translate(1094 460)"><use xlink:href="#routingStage"/><text x="85" y="25" text-anchor="middle" class="label">Stage 2</text></g>
  <path d="M1264 535H1287" class="arrow"/>
  <g transform="translate(1288 460)"><use xlink:href="#routingStage"/><text x="85" y="25" text-anchor="middle" class="label">Stage 3</text></g>
  <rect x="987" y="641" width="356" height="72" rx="4" class="neutral"/>
  <text x="1165" y="666" text-anchor="middle" class="label">Independent aggregation, BNNeck, classifier</text>
  <text x="1165" y="688" text-anchor="middle" class="small">z<tspan baseline-shift="sub" font-size="10">facr</tspan>: 3 × 768 = 2304-D · branch loss × 0.50</text>
  <path d="M1165 610V637" class="thin"/>
  <text x="1165" y="735" text-anchor="middle" class="small" fill="#a63f3f">FACR gradients cannot alter the shared backbone or main selector path</text>
</g>

<!-- part branch -->
<g>
  <rect x="442" y="862" width="1068" height="164" rx="5" class="group"/>
  <text x="470" y="892" class="head">Three-Stripe Part Branch</text>
  <text x="470" y="915" class="small">HS-masked feature maps preserve coarse body layout</text>
  <path d="M716 230V842H499V929" class="maskLine"/>

  <g transform="translate(500 930)"><rect width="58" height="60" class="rgb"/><path d="M0 20H58M0 40H58" stroke="#78a870"/><text x="29" y="17" text-anchor="middle" class="tiny">stripe 1</text><text x="29" y="37" text-anchor="middle" class="tiny">stripe 2</text><text x="29" y="57" text-anchor="middle" class="tiny">stripe 3</text></g>
  <g transform="translate(570 930)"><rect width="58" height="60" class="nir"/><path d="M0 20H58M0 40H58" stroke="#7ca2c8"/><text x="29" y="17" text-anchor="middle" class="tiny">stripe 1</text><text x="29" y="37" text-anchor="middle" class="tiny">stripe 2</text><text x="29" y="57" text-anchor="middle" class="tiny">stripe 3</text></g>
  <g transform="translate(640 930)"><rect width="58" height="60" class="tir"/><path d="M0 20H58M0 40H58" stroke="#d78981"/><text x="29" y="17" text-anchor="middle" class="tiny">stripe 1</text><text x="29" y="37" text-anchor="middle" class="tiny">stripe 2</text><text x="29" y="57" text-anchor="middle" class="tiny">stripe 3</text></g>
  <path d="M704 960H773" class="arrow"/>
  <rect x="774" y="925" width="256" height="70" rx="4" class="part"/>
  <text x="902" y="950" text-anchor="middle" class="label">Stripe mean pooling</text><text x="902" y="972" text-anchor="middle" class="small">3 modalities × 3 stripes × 768</text>
  <path d="M1030 960H1075" class="arrow"/>
  <rect x="1076" y="925" width="268" height="70" rx="4" class="neutral"/>
  <text x="1210" y="950" text-anchor="middle" class="label">Concatenate + BNNeck + classifier</text><text x="1210" y="972" text-anchor="middle" class="small">z<tspan baseline-shift="sub" font-size="10">part</tspan>: 6912-D · branch loss × 0.15</text>
  <path d="M1344 960H1488" class="arrow"/>
</g>

<!-- final retrieval descriptor -->
<g>
  <rect x="1544" y="120" width="332" height="780" rx="5" class="group"/>
  <text x="1710" y="153" text-anchor="middle" class="head">Final Retrieval Descriptor</text>
  <text x="1710" y="175" text-anchor="middle" class="small">fixed inference composition</text>

  <path d="M1230 261H1518V247H1570" class="arrow"/>
  <rect x="1570" y="215" width="280" height="72" rx="4" class="output"/>
  <text x="1590" y="240" class="label">Main selector</text><text x="1590" y="263" class="small">L2Norm(z<tspan baseline-shift="sub" font-size="10">main</tspan>)</text><text x="1828" y="253" text-anchor="end" class="label">2304-D × 1.00</text>

  <path d="M1510 677H1528V405H1570" class="arrow"/>
  <rect x="1570" y="369" width="280" height="72" rx="4" class="facr"/>
  <text x="1590" y="394" class="label">Isolated FACR</text><text x="1590" y="417" class="small">L2Norm(z<tspan baseline-shift="sub" font-size="10">facr</tspan>)</text><text x="1828" y="407" text-anchor="end" class="label">2304-D × 0.25</text>

  <path d="M1488 960H1528V563H1570" class="arrow"/>
  <rect x="1570" y="527" width="280" height="72" rx="4" class="part"/>
  <text x="1590" y="552" class="label">Three-stripe part</text><text x="1590" y="575" class="small">L2Norm(z<tspan baseline-shift="sub" font-size="10">part</tspan>)</text><text x="1828" y="565" text-anchor="end" class="label">6912-D × 0.30</text>

  <path d="M1850 251H1860V680H1827M1850 405H1860M1850 563H1860" class="thin"/>
  <rect x="1600" y="648" width="220" height="64" rx="5" class="neutral"/>
  <text x="1710" y="675" text-anchor="middle" class="label">Block concatenation</text><text x="1710" y="697" text-anchor="middle" class="small">no learned test-time weights</text>
  <path d="M1710 712V753" class="arrow"/>
  <rect x="1591" y="755" width="238" height="78" rx="39" class="output"/>
  <text x="1710" y="785" text-anchor="middle" class="subhead">11,520-D descriptor</text>
  <text x="1710" y="807" text-anchor="middle" class="small">single view · cosine distance</text>
  <text x="1710" y="861" text-anchor="middle" class="small">No TTA · No re-ranking · No DHF/CRUF</text>
</g>

<!-- footer -->
<text x="24" y="1049" class="small muted">Frozen E060 architecture. HS uses fixed Top-1 per attention head; FACR is independently supervised through detached backbone tokens.</text>
</svg>
