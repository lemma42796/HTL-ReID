<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1900" height="1060" viewBox="0 0 1900 1060">
<title>Overall architecture of HTL-ReID</title>
<desc>Shared ViT encoding of RGB, NIR and TIR; HS token selection; three-stage mask-constrained ACI; PLR from selected patches; seven-route DHF from complete tokens; weighted descriptor concatenation.</desc>
<defs>
 <style>
 text{font-family:"Times New Roman",Times,serif;fill:#222}.mt{font-size:25px;font-weight:700}.st{font-size:18px;font-weight:700}.lb{font-size:16px;font-weight:700}.tx{font-size:14px}.sm{font-size:12px}.tn{font-size:10.5px}
 .grp{fill:#fff;stroke:#666;stroke-width:1.7;stroke-dasharray:8 6}.neu{fill:#f3f3f3;stroke:#777;stroke-width:1.35}.r{fill:#ddeed7;stroke:#72a866;stroke-width:1.5}.n{fill:#dfeaf6;stroke:#6d98c5;stroke-width:1.5}.t{fill:#f6dcd8;stroke:#d47469;stroke-width:1.5}.h{fill:#e9ddf0;stroke:#9272a1;stroke-width:1.5}.sel{fill:#fff49a;stroke:#d8be22;stroke-width:1.5}.exp{fill:#f9e7b7;stroke:#d3a646;stroke-width:1.35}.w{fill:#fff;stroke:#777;stroke-width:1.25}
 .f{fill:none;stroke:#222;stroke-width:1.7;marker-end:url(#a)}.th{fill:none;stroke:#444;stroke-width:1.2;marker-end:url(#as)}.mf{fill:none;stroke:#9272a1;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#ap)}.rl{fill:none;stroke:#72a866;stroke-width:1.7;marker-end:url(#ar)}.nl{fill:none;stroke:#6d98c5;stroke-width:1.7;marker-end:url(#an)}.tl{fill:none;stroke:#d47469;stroke-width:1.7;marker-end:url(#at)}.mut{fill:#777}
 </style>
 <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#222"/></marker>
 <marker id="as" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#444"/></marker>
 <marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#9272a1"/></marker>
 <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#72a866"/></marker><marker id="an" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#6d98c5"/></marker><marker id="at" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#d47469"/></marker>
 <g id="grid"><rect width="34" height="34" fill="#fff" stroke="#777"/><path d="M11.3 0V34M22.7 0V34M0 11.3H34M0 22.7H34" stroke="#aaa" stroke-width=".8"/></g>
 <g id="sgrid"><use xlink:href="#grid"/><rect x="1" y="1" width="10" height="10" class="sel"/><rect x="23" y="1" width="10" height="10" class="sel"/><rect x="12" y="12" width="10" height="10" class="sel"/><rect x="1" y="23" width="10" height="10" class="sel"/></g>
 <g id="aciStage"><rect width="190" height="178" rx="3" class="w"/><circle cx="48" cy="67" r="18" class="r"/><text x="48" y="72" text-anchor="middle" class="lb">R</text><circle cx="142" cy="67" r="18" class="n"/><text x="142" y="72" text-anchor="middle" class="lb">N</text><circle cx="95" cy="133" r="18" class="t"/><text x="95" y="138" text-anchor="middle" class="lb">T</text><path d="M67 67H122" class="rl"/><path d="M131 82L108 117" class="nl"/><path d="M82 117L59 82" class="tl"/><text x="95" y="166" text-anchor="middle" class="tn">adaptive routing + gated residual</text></g>
 <g id="dhfTail"><path d="M90 22H121" class="th"/><rect x="122" y="5" width="145" height="34" rx="2" class="neu"/><text x="194" y="27" text-anchor="middle" class="sm">Cross Attn.</text><path d="M267 22H298" class="th"/><rect x="299" y="5" width="112" height="34" rx="2" class="exp"/><text x="355" y="27" text-anchor="middle" class="sm">Expert</text><path d="M411 22H440" class="th"/><rect x="441" y="5" width="99" height="34" rx="17" class="exp"/><text x="490" y="27" text-anchor="middle" class="sm">Gate</text></g>
</defs>
<rect width="1900" height="1060" fill="#fff"/>

<!-- restrained color legend -->
<g transform="translate(25 18)"><rect width="18" height="12" class="r"/><text x="24" y="11" class="sm">RGB</text><rect x="74" width="18" height="12" class="n"/><text x="98" y="11" class="sm">NIR</text><rect x="147" width="18" height="12" class="t"/><text x="171" y="11" class="sm">TIR</text><rect x="218" width="18" height="12" class="h"/><text x="242" y="11" class="sm">selection</text><rect x="326" width="18" height="12" class="sel"/><text x="350" y="11" class="sm">selected token / union</text><rect x="499" width="18" height="12" class="exp"/><text x="523" y="11" class="sm">expert / gate</text><path d="M625 6H662" class="mf"/><text x="670" y="11" class="sm">HS-mask constraint</text></g>

<!-- local real RGB/NIR/TIR triplet -->
<g><text x="72" y="62" text-anchor="middle" class="st">Input</text>
 <image x="23" y="78" width="98" height="188" preserveAspectRatio="xMidYMid slice" xlink:href="input_rgb.png"/><rect x="23" y="78" width="98" height="188" fill="none" stroke="#72a866" stroke-width="3"/><text x="72" y="287" text-anchor="middle" class="lb" fill="#548a4b">RGB</text>
 <image x="23" y="318" width="98" height="188" preserveAspectRatio="xMidYMid slice" xlink:href="input_nir.png"/><rect x="23" y="318" width="98" height="188" fill="none" stroke="#6d98c5" stroke-width="3"/><text x="72" y="527" text-anchor="middle" class="lb" fill="#527ca7">NIR</text>
 <image x="23" y="558" width="98" height="188" preserveAspectRatio="xMidYMid slice" xlink:href="input_tir.png"/><rect x="23" y="558" width="98" height="188" fill="none" stroke="#d47469" stroke-width="3"/><text x="72" y="767" text-anchor="middle" class="lb" fill="#bd5e54">TIR</text>
</g>

<!-- shared backbone -->
<g><rect x="154" y="58" width="205" height="724" rx="4" class="grp"/><text x="256" y="88" text-anchor="middle" class="st">Shared ViT Backbone</text><text x="256" y="107" text-anchor="middle" class="sm">weight sharing</text>
 <path d="M121 174H174" class="rl"/><path d="M121 414H174" class="nl"/><path d="M121 654H174" class="tl"/>
 <g transform="translate(176 130)"><rect width="160" height="72" rx="3" class="r"/><text x="80" y="28" text-anchor="middle" class="lb">Patch Embedding</text><text x="80" y="49" text-anchor="middle" class="sm">[CLS] + patches</text><use xlink:href="#grid" x="63" y="84"/><path d="M80 72V80" class="th"/></g>
 <g transform="translate(176 370)"><rect width="160" height="72" rx="3" class="n"/><text x="80" y="28" text-anchor="middle" class="lb">Patch Embedding</text><text x="80" y="49" text-anchor="middle" class="sm">[CLS] + patches</text><use xlink:href="#grid" x="63" y="84"/><path d="M80 72V80" class="th"/></g>
 <g transform="translate(176 610)"><rect width="160" height="72" rx="3" class="t"/><text x="80" y="28" text-anchor="middle" class="lb">Patch Embedding</text><text x="80" y="49" text-anchor="middle" class="sm">[CLS] + patches</text><use xlink:href="#grid" x="63" y="84"/><path d="M80 72V80" class="th"/></g>
 <g class="neu"><rect x="188" y="247" width="136" height="58" rx="3"/><rect x="188" y="487" width="136" height="58" rx="3"/><rect x="188" y="727" width="136" height="38" rx="3"/></g>
 <text x="256" y="272" text-anchor="middle" class="lb">Transformer</text><text x="256" y="292" text-anchor="middle" class="sm">shared parameters</text><text x="256" y="512" text-anchor="middle" class="lb">Transformer</text><text x="256" y="532" text-anchor="middle" class="sm">shared parameters</text><text x="256" y="751" text-anchor="middle" class="lb">Transformer</text><path d="M256 248V218M256 488V458M256 728V698" class="th"/>
</g>

<!-- HS -->
<g><rect x="392" y="58" width="346" height="306" rx="4" class="grp"/><text x="565" y="88" text-anchor="middle" class="mt">HS</text><text x="565" y="108" text-anchor="middle" class="sm">complete token selection</text>
 <path d="M359 166H414M359 276H414" class="f"/><rect x="414" y="128" width="138" height="70" rx="3" class="h"/><text x="483" y="155" text-anchor="middle" class="lb">Attention Rollout</text><text x="483" y="176" text-anchor="middle" class="sm">head-wise top-K union</text><rect x="414" y="238" width="138" height="70" rx="3" class="h"/><text x="483" y="265" text-anchor="middle" class="lb">Frequency Mask</text><text x="483" y="286" text-anchor="middle" class="sm">4-level Haar DWT</text>
 <path d="M552 163H592V192M552 273H592V242" class="th"/><circle cx="592" cy="217" r="25" class="sel"/><text x="592" y="222" text-anchor="middle" class="lb">OR</text><path d="M617 217H651" class="f"/><use xlink:href="#sgrid" x="659" y="200"/><text x="676" y="252" text-anchor="middle" class="sm">shared hard mask</text><text x="565" y="340" text-anchor="middle" class="sm">rollout ∪ frequency evidence → selected patches</text>
</g>

<!-- ACI -->
<g><rect x="768" y="58" width="726" height="306" rx="4" class="grp"/><text x="1131" y="88" text-anchor="middle" class="mt">ACI</text><text x="1131" y="108" text-anchor="middle" class="sm">adaptive cross-modal interaction on complete backbone tokens</text>
 <path d="M359 384H1512" fill="none" stroke="#222" stroke-width="1.7"/><text x="562" y="379" text-anchor="middle" class="sm">complete RGB / NIR / TIR token bus</text><path d="M755 384V145H795" class="f"/><path d="M693 235V125H846" class="mf"/>
 <g transform="translate(798 132)"><use xlink:href="#aciStage"/><text x="95" y="24" text-anchor="middle" class="lb">Stage 1</text></g><path d="M988 221H1019" class="f"/>
 <g transform="translate(1020 132)"><use xlink:href="#aciStage"/><text x="95" y="24" text-anchor="middle" class="lb">Stage 2</text></g><path d="M1210 221H1241" class="f"/>
 <g transform="translate(1242 132)"><use xlink:href="#aciStage"/><text x="95" y="24" text-anchor="middle" class="lb">Stage 3</text></g><path d="M1432 221H1475" class="f"/><text x="1476" y="211" class="tn">3d</text>
</g>

<!-- PLR -->
<g><rect x="392" y="402" width="424" height="350" rx="4" class="grp"/><text x="604" y="432" text-anchor="middle" class="mt">PLR</text><text x="604" y="452" text-anchor="middle" class="sm">independent local representation from HS-selected patches</text><path d="M693 234V384H424V485" class="mf"/>
 <g transform="translate(425 478)"><text y="26" class="lb" fill="#548a4b">RGB</text><use xlink:href="#sgrid" x="51" y="2"/><path d="M93 19H123" class="th"/><g class="r"><rect x="124" width="42" height="12"/><rect x="124" y="14" width="42" height="12"/><rect x="124" y="28" width="42" height="12"/></g><text x="145" y="58" text-anchor="middle" class="tn">3 stripes</text><path d="M168 20H204" class="th"/><rect x="205" y="5" width="108" height="30" class="r"/><text x="259" y="25" text-anchor="middle" class="sm">local features</text></g>
 <g transform="translate(425 563)"><text y="26" class="lb" fill="#527ca7">NIR</text><use xlink:href="#sgrid" x="51" y="2"/><path d="M93 19H123" class="th"/><g class="n"><rect x="124" width="42" height="12"/><rect x="124" y="14" width="42" height="12"/><rect x="124" y="28" width="42" height="12"/></g><text x="145" y="58" text-anchor="middle" class="tn">3 stripes</text><path d="M168 20H204" class="th"/><rect x="205" y="5" width="108" height="30" class="n"/><text x="259" y="25" text-anchor="middle" class="sm">local features</text></g>
 <g transform="translate(425 648)"><text y="26" class="lb" fill="#bd5e54">TIR</text><use xlink:href="#sgrid" x="51" y="2"/><path d="M93 19H123" class="th"/><g class="t"><rect x="124" width="42" height="12"/><rect x="124" y="14" width="42" height="12"/><rect x="124" y="28" width="42" height="12"/></g><text x="145" y="58" text-anchor="middle" class="tn">3 stripes</text><path d="M168 20H204" class="th"/><rect x="205" y="5" width="108" height="30" class="t"/><text x="259" y="25" text-anchor="middle" class="sm">local features</text></g>
 <path d="M738 498H776V670M738 583H776M738 668H776" class="th"/><circle cx="776" cy="690" r="20" class="w"/><text x="776" y="695" text-anchor="middle" class="lb">C</text><text x="776" y="726" text-anchor="middle" class="sm">9d</text>
</g>

<!-- DHF seven routes -->
<g><rect x="846" y="402" width="648" height="594" rx="4" class="grp"/><text x="1170" y="432" text-anchor="middle" class="mt">DHF</text><text x="1170" y="452" text-anchor="middle" class="sm">independent heterogeneous fusion of complete backbone tokens</text><path d="M826 384V520H873" class="f"/>
 <text x="893" y="482" class="sm">route</text><text x="1048" y="482" class="sm">route-token attention</text><text x="1236" y="482" class="sm">residual expert</text><text x="1384" y="482" class="sm">4-head gate</text>
 <g transform="translate(875 498)"><rect width="90" height="44" class="r"/><text x="45" y="27" text-anchor="middle" class="lb">RGB</text><use xlink:href="#dhfTail"/><text x="558" y="27" class="lb">× α₁</text></g>
 <g transform="translate(875 565)"><rect width="90" height="44" class="n"/><text x="45" y="27" text-anchor="middle" class="lb">NIR</text><use xlink:href="#dhfTail"/><text x="558" y="27" class="lb">× α₂</text></g>
 <g transform="translate(875 632)"><rect width="90" height="44" class="t"/><text x="45" y="27" text-anchor="middle" class="lb">TIR</text><use xlink:href="#dhfTail"/><text x="558" y="27" class="lb">× α₃</text></g>
 <g transform="translate(875 699)"><rect width="45" height="44" class="r"/><rect x="45" width="45" height="44" class="n"/><text x="45" y="27" text-anchor="middle" class="lb">R+N</text><use xlink:href="#dhfTail"/><text x="558" y="27" class="lb">× α₄</text></g>
 <g transform="translate(875 766)"><rect width="45" height="44" class="r"/><rect x="45" width="45" height="44" class="t"/><text x="45" y="27" text-anchor="middle" class="lb">R+T</text><use xlink:href="#dhfTail"/><text x="558" y="27" class="lb">× α₅</text></g>
 <g transform="translate(875 833)"><rect width="45" height="44" class="n"/><rect x="45" width="45" height="44" class="t"/><text x="45" y="27" text-anchor="middle" class="lb">N+T</text><use xlink:href="#dhfTail"/><text x="558" y="27" class="lb">× α₆</text></g>
 <g transform="translate(875 900)"><rect width="30" height="44" class="r"/><rect x="30" width="30" height="44" class="n"/><rect x="60" width="30" height="44" class="t"/><text x="45" y="27" text-anchor="middle" class="lb">All</text><use xlink:href="#dhfTail"/><text x="558" y="27" class="lb">× α₇</text></g>
 <path d="M1460 520H1475V927M1460 587H1475M1460 654H1475M1460 721H1475M1460 788H1475M1460 855H1475" class="th"/><circle cx="1475" cy="950" r="18" class="w"/><text x="1475" y="955" text-anchor="middle" class="lb">C</text><text x="1475" y="980" text-anchor="middle" class="sm">7d</text>
</g>

<!-- final weighted concatenation -->
<g><rect x="1530" y="402" width="346" height="594" rx="4" class="grp"/><text x="1703" y="432" text-anchor="middle" class="mt">Final Descriptor</text><text x="1703" y="452" text-anchor="middle" class="sm">branch norm. → weight → concatenate → L2 norm.</text>
 <path d="M1494 221H1555V500" class="f"/><rect x="1560" y="484" width="198" height="50" class="neu"/><text x="1576" y="506" class="lb">ACI</text><text x="1576" y="524" class="sm">3d descriptor</text><text x="1738" y="514" text-anchor="end" class="lb">× 1.00</text>
 <path d="M1512 384V577H1560" class="f"/><rect x="1560" y="552" width="198" height="50" class="neu"/><text x="1576" y="574" class="lb">Original CLS</text><text x="1576" y="592" class="sm">3d descriptor</text><text x="1738" y="582" text-anchor="end" class="lb">× 1.10</text>
 <path d="M816 690V1008H1518V645H1560" class="f"/><rect x="1560" y="620" width="198" height="50" fill="#fafafa" stroke="#aaa"/><text x="1576" y="642" class="lb mut">PLR</text><text x="1576" y="660" class="sm mut">9d descriptor</text><text x="1738" y="650" text-anchor="end" class="lb mut">× 0</text>
 <path d="M1493 950H1522V716H1560" class="f"/><rect x="1560" y="688" width="198" height="50" class="neu"/><text x="1576" y="710" class="lb">DHF</text><text x="1576" y="728" class="sm">7d descriptor</text><text x="1738" y="718" text-anchor="end" class="lb">× 1.58</text>
 <path d="M1758 509H1801V757M1758 577H1801M1758 645H1801M1758 713H1801" class="th"/><circle cx="1801" cy="782" r="25" class="w"/><text x="1801" y="788" text-anchor="middle" class="lb">C</text><path d="M1801 807V852" class="f"/><rect x="1628" y="854" width="216" height="62" class="w"/><text x="1736" y="881" text-anchor="middle" class="lb">Weighted Descriptor</text><text x="1736" y="901" text-anchor="middle" class="sm">for retrieval</text><text x="1703" y="956" text-anchor="middle" class="sm mut">Frozen E045 inference: w<tspan baseline-shift="sub">PLR</tspan> = 0</text>
</g>
<text x="949" y="1035" text-anchor="middle" class="sm mut">Complete tokens feed ACI and DHF; HS-selected patch features feed PLR.</text>
</svg>
