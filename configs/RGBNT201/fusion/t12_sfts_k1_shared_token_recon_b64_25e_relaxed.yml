# Determinism attribution (E039): identical to the E038 batch-64 train25
# protocol, but with SOLVER.STRICT_DETERMINISM disabled so only the seeded
# sampler/loader/reconstruction generators remain while deterministic
# cuBLAS/cuDNN algorithm selection is relaxed back to the pre-fix behavior.
# Merge after configs/RGBNT201/paper/base.yml.
MODEL:
  SFTS_ENABLED: 1
  SFTS_RATIO: 0.0078125
  SFTS_LEARNABLE_K: 0
  SFTS_BUDGET_LOSS_WEIGHT: 0.0
  SFTS_RESIDUAL_TOKEN: 0
  HS_ENABLED: 0
  FACSS_ENABLED: 0
  FREQUENCY_ENABLED: 1
  QUALITY_AWARE: 0
  SELECTED_PATCH_BLEND_WEIGHT: 0.0
  TPM: 0
  FACR: 1
  FACR_USE_SCORES: 0
  FACR_USE_MASKS: 1
  FACR_NUM_HEADS: 12
  FACR_STEPS: 3
  FACR_SCORE_BIAS_SCALE: 0.0
  FACR_SCORE_FLOOR: 0.05
  FACR_DETACH_SCORES: 1
  FACR_GATE_INIT_BIAS: 0.0
  FACR_INDEPENDENT_AGG: 0
  FACR_SELF_REFINE: 0
  FACR_ROUTE_BALANCE_WEIGHT: 0.0
  CROSS_MODAL_RECON_ENABLED: 1
  CROSS_MODAL_RECON_HIDDEN_DIM: 256
  CROSS_MODAL_RECON_LOSS_WEIGHT: 0.1
  AUX_LOSS_WEIGHT: 1.0
  AUX_WARMUP_EPOCHS: 5

SOLVER:
  IMS_PER_BATCH: 64
  BASE_LR: 0.00035
  BACKBONE_LR_FACTOR: 0.8
  NEW_MODULE_LR_FACTOR: 1.0
  MAX_EPOCHS: 50
  TRAIN_EPOCHS: 25
  STRICT_DETERMINISM: 0
