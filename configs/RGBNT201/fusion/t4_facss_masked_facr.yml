# T4: true selection-then-fusion. FACSS Top-K masks restrict which complete
# backbone patch tokens ACI may read; continuous score bias is disabled.
MODEL:
  HS_ENABLED: 1
  QUALITY_AWARE: 0
  SELECTED_PATCH_BLEND_WEIGHT: 0.0
  ACI: 1
  ACI_USE_SCORES: 0
  ACI_USE_MASKS: 1
  ACI_NUM_HEADS: 12
  ACI_STEPS: 3
  ACI_SCORE_BIAS_SCALE: 0.0
  ACI_SCORE_FLOOR: 0.05
  ACI_DETACH_SCORES: 1
  ACI_GATE_INIT_BIAS: 0.0
