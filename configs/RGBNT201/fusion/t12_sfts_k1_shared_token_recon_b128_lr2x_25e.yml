# E035 optimization screening: retain the complete T12 batch-128 model,
# double all learning rates to compensate for halving optimizer steps per
# epoch, and stop after epoch 25 while preserving the 50-epoch cosine horizon.
# Merge after configs/RGBNT201/paper/base.yml.
MODEL:
  HS_ENABLED: 1
  HS_RATIO: 0.0078125
  HS_LEARNABLE_K: 0
  HS_BUDGET_LOSS_WEIGHT: 0.0
  HS_RESIDUAL_TOKEN: 0
  FREQUENCY_ENABLED: 1
  QUALITY_AWARE: 0
  SELECTED_PATCH_BLEND_WEIGHT: 0.0
  ACI: 1
  ACI_USE_SCORES: 0
  ACI_USE_MASKS: 1
  ACI_NUM_HEADS: 12
  ACI_STEPS: 3
  ACI_SCORE_BIAS_SCALE: 0.0
  ACI_SCORE_FLOOR: 0.05
  ACI_DETACH_SCORES: 1
  ACI_GATE_INIT_BIAS: 0.0
  ACI_INDEPENDENT_AGG: 0
  ACI_SELF_REFINE: 0
  ACI_ROUTE_BALANCE_WEIGHT: 0.0
  CROSS_MODAL_RECON_ENABLED: 1
  CROSS_MODAL_RECON_HIDDEN_DIM: 256
  CROSS_MODAL_RECON_LOSS_WEIGHT: 0.1
  AUX_LOSS_WEIGHT: 1.0
  AUX_WARMUP_EPOCHS: 5

SOLVER:
  BASE_LR: 0.0007
  BACKBONE_LR_FACTOR: 0.8
  NEW_MODULE_LR_FACTOR: 1.0
  MAX_EPOCHS: 50
  TRAIN_EPOCHS: 25
