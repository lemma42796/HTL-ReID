# T6: SFTS learns a global discrete tokens-per-head K from identification
# supervision. Straight-through Gumbel-Softmax explores the candidate set;
# a final-union budget loss prevents the trivial all-token solution.
# Merge after configs/RGBNT201/paper/base.yml.
MODEL:
  SFTS_ENABLED: 1
  SFTS_LEARNABLE_K: 1
  SFTS_K_CANDIDATES: [1, 2, 4, 8, 16]
  SFTS_GUMBEL_TAU: 1.0
  SFTS_GUMBEL_TAU_MIN: 0.2
  SFTS_GUMBEL_TAU_DECAY: 0.9
  SFTS_BUDGET_LOSS_WEIGHT: 0.05
  HS_ENABLED: 0
  FACSS_ENABLED: 0
  FREQUENCY_ENABLED: 1
  QUALITY_AWARE: 0
  SELECTED_PATCH_BLEND_WEIGHT: 0.0
  TPM: 0
  FACR: 1
  FACR_USE_SCORES: 0
  FACR_USE_MASKS: 1
  FACR_NUM_HEADS: 12
  FACR_STEPS: 3
  FACR_SCORE_BIAS_SCALE: 0.0
  FACR_SCORE_FLOOR: 0.05
  FACR_DETACH_SCORES: 1
  FACR_GATE_INIT_BIAS: 0.0
  AUX_LOSS_WEIGHT: 1.0
  AUX_WARMUP_EPOCHS: 0
