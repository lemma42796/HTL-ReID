# T6: SFTS learns a global discrete tokens-per-head K from identification
# supervision. Straight-through Gumbel-Softmax explores the candidate set;
# a final-union budget loss prevents the trivial all-token solution.
# Merge after configs/RGBNT201/paper/base.yml.
MODEL:
  HS_ENABLED: 1
  HS_LEARNABLE_K: 1
  HS_K_CANDIDATES: [1, 2, 4, 8, 16]
  HS_GUMBEL_TAU: 1.0
  HS_GUMBEL_TAU_MIN: 0.2
  HS_GUMBEL_TAU_DECAY: 0.9
  HS_BUDGET_LOSS_WEIGHT: 0.05
  FREQUENCY_ENABLED: 1
  QUALITY_AWARE: 0
  SELECTED_PATCH_BLEND_WEIGHT: 0.0
  ACI: 1
  ACI_USE_SCORES: 0
  ACI_USE_MASKS: 1
  ACI_NUM_HEADS: 12
  ACI_STEPS: 3
  ACI_SCORE_BIAS_SCALE: 0.0
  ACI_SCORE_FLOOR: 0.05
  ACI_DETACH_SCORES: 1
  ACI_GATE_INIT_BIAS: 0.0
  AUX_LOSS_WEIGHT: 1.0
  AUX_WARMUP_EPOCHS: 0
