# Shared 30-epoch protocol for the HS-FACSS-AGF recovery chain.
# Merge this file first, then exactly one R001-R004 overlay.
MODEL:
  NAME: 'HTL-ReID-recovery'
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH_T: '/root/autodl-tmp/pretrained/vit_base_patch16_224_augreg2_in21k_ft_in1k.pth'
  RESUME_PATH: ''
  TRANSFORMER_TYPE: 'vit_base_patch16_224'
  STRIDE_SIZE: [16, 16]
  SIE_CAMERA: True
  SIE_VIEW: False
  DIST_TRAIN: False
  AL: 0

  # Common readout: identical fixed selected-patch residual for R001-R003.
  # R001 uses all patches; R002/R003 change only the selection mask.
  SELECTED_PATCH_BLEND_WEIGHT: 0.15
  SELECTED_PATCH_CONTEXT: 'mean'
  SELECTED_AGGREGATION: 0
  BRANCH_FEATURE_SOURCE: 'final'
  MODALITY_SPECIFIC_HEADS: 1

  HS_LAYERS: [4, 8, 12]
  HS_K: 16
  FACSS_K: 16
  FACSS_DYNAMIC_K: 0
  FACSS_MIN_K: 16
  FACSS_MAX_K: 16
  FACSS_SOFT_RESIDUAL_WEIGHT: 0.0
  FACSS_ALPHA_HIDDEN: 192
  FACSS_CROSS_POOL: 'max'
  FACSS_ALPHA_GRANULARITY: 'sample'
  FACSS_NORM: 'minmax'
  FACSS_STE: 1
  FACSS_STE_TAU: 1.0
  FACSS_MODALITY_UNION: 0
  FACSS_UNION_PROMOTE: 0

  AGF_MODE: 'paper_cascade'
  AGF_NUM_HEADS: 12
  AGF_USE_MASKS: 1
  AGF_GATE_INIT_BIAS: 0.0
  AGF_QUALITY_SCALE: 0
  AGF_FUSION_MODE: 'residual'
  AGF_RESIDUAL_WEIGHT: 1.0
  AGF_LEARNABLE_RESIDUAL: 0
  AGF_AUX_SUPERVISION: 0

  # Excluded from every recovery row.
  FREQUENCY_ENABLED: 0
  FREQUENCY_QUALITY_AWARE: 0
  QUALITY_AWARE: 0
  OCFR: 0
  MODALITY_ADAPTER: 0
  PART_BRANCH: 0
  ALIGN_LOSS_WEIGHT: 0.0
  TOKEN_CONSISTENCY_WEIGHT: 0.0
  BCC_LOSS_WEIGHT: 0.0
  GATE_BALANCE_WEIGHT: 0.0
  QUALITY_PERTURB_LOSS_WEIGHT: 0.0
  FUSE_LOSS_WEIGHT: 1.0
  BRANCH_LOSS_WEIGHT: 0.3333333333
  AUX_LOSS_WEIGHT: 0.0
  IF_LABELSMOOTH: 'on'
  METRIC_LOSS_TYPE: 'triplet'
  NO_MARGIN: False
  ID_LOSS_WEIGHT: 1.0
  TRIPLET_LOSS_WEIGHT: 1.0

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  GRAY_REPLACE_PROB: 0.0
  MODALITY_DROP_PROB: 0.0

DATASETS:
  NAMES: 'RGBNT201'
  ROOT_DIR: '/root/autodl-tmp/datasets'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 8
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  BASE_LR: 0.001
  BACKBONE_LR_FACTOR: 1.0
  NEW_MODULE_LR_FACTOR: 1.0
  MOMENTUM: 0.9
  MARGIN: 0.3
  WEIGHT_DECAY: 0.0001
  WEIGHT_DECAY_BIAS: 0.0001
  WARMUP_ITERS: 5
  WARMUP_METHOD: 'linear'
  SCHEDULER_UNIT: 'epoch'
  IMS_PER_BATCH: 64
  MAX_EPOCHS: 30
  TRAIN_EPOCHS: 0
  SEED: 1111
  LOG_PERIOD: 50
  EVAL_PERIOD: 5
  SAVE_BEST_CHECKPOINT: True
  SAVE_PERIODIC_CHECKPOINTS: False

TEST:
  IMS_PER_BATCH: 128
  RE_RANKING: 'no'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  PART_FEAT: 'off'

OUTPUT_DIR: '/root/autodl-tmp/outputs/HTL-ReID-old/recovery'
