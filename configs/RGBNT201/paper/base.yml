# Shared protocol for the formal RGBNT201 M0-M3 controlled comparison.
# Merge this file first, then exactly one of m0.yml, m1.yml, m2.yml, m3.yml.
MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH_T: '/root/autodl-tmp/pretrained/vit_base_patch16_224_augreg2_in21k_ft_in1k.pth'
  TRANSFORMER_TYPE: 'vit_base_patch16_224'
  STRIDE_SIZE: [16, 16]
  SIE_CAMERA: True
  SIE_VIEW: False
  DIST_TRAIN: False
  AL: 1

  HS_LAYERS: [4, 8, 12]
  HS_K: 16
  FACSS_K: 16
  FACSS_DYNAMIC_K: 1
  FACSS_MIN_K: 8
  FACSS_MAX_K: 32
  FACSS_K_HIDDEN: 192
  FACSS_SOFT_RESIDUAL_WEIGHT: 0.15
  FACSS_ALPHA_HIDDEN: 192
  FACSS_CROSS_POOL: 'max'
  FACSS_ALPHA_GRANULARITY: 'sample'
  FACSS_NORM: 'minmax'
  FACSS_STE: 1
  FACSS_STE_TAU: 1.0
  FACSS_MODALITY_UNION: 1
  FACSS_UNION_PROMOTE: 1
  SELECTED_PATCH_CONTEXT: 'mean'
  SELECTED_PATCH_ATTN_SCALE: 10.0
  SELECTED_PATCH_GATE_INIT: 0.0
  SELECTED_AGGREGATION: 0
  SFTS_RESIDUAL_TOKEN: 0

  # Excluded from every paper row.
  FREQUENCY_ENABLED: 0
  FREQUENCY_QUALITY_AWARE: 0
  OCFR: 0
  AGF: 0
  TPM: 0
  FACR: 0
  FACR_SELF_REFINE: 0
  FACR_SELF_REFINE_SCALE_INIT: 0.1
  FACR_ROUTE_BALANCE_WEIGHT: 0.0
  MODALITY_ADAPTER: 0
  PART_BRANCH: 0
  ALIGN_LOSS_WEIGHT: 0.0
  TOKEN_CONSISTENCY_WEIGHT: 0.0
  BCC_LOSS_WEIGHT: 0.0
  GATE_BALANCE_WEIGHT: 0.0
  QUALITY_PERTURB_LOSS_WEIGHT: 0.0
  AUX_LOSS_WEIGHT: 0.0

INPUT:
  SIZE_TRAIN: [384, 192]
  SIZE_TEST: [384, 192]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  GRAY_REPLACE_PROB: 0.3
  MODALITY_DROP_PROB: 0.0

DATASETS:
  NAMES: 'RGBNT201'
  ROOT_DIR: '/root/autodl-tmp/datasets'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 8
  NUM_WORKERS: 14

SOLVER:
  OPTIMIZER_NAME: 'AdamW'
  BASE_LR: 0.0001
  BACKBONE_LR_FACTOR: 0.1
  NEW_MODULE_LR_FACTOR: 1.0
  WEIGHT_DECAY: 0.05
  WARMUP_ITERS: 20
  SCHEDULER_UNIT: 'iteration'
  IMS_PER_BATCH: 40
  MAX_EPOCHS: 120
  # Keep the 120-epoch cosine horizon but stop each controlled row at epoch 20
  # so the run completes inside the mandatory 30-minute wall-clock cap.
  TRAIN_EPOCHS: 20
  SEED: 1111
  # Validation is relatively expensive; the trainer still always evaluates
  # the final epoch even when it is not divisible by this period.
  EVAL_PERIOD: 5
  SAVE_BEST_CHECKPOINT: True
  SAVE_PERIODIC_CHECKPOINTS: False

TEST:
  RE_RANKING: 'no'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  PART_FEAT: 'off'

OUTPUT_DIR: '/root/autodl-tmp/outputs/HTL-ReID'
