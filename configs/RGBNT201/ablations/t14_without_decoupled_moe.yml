# E048: clean T14 ablation without the seven-route decoupled MoE.
# This mirrors E043's initialization, losses, schedule, and non-MoE
# descriptors; the only effective structural change is disabling the MoE.
MODEL:
  RESUME_PATH: '/root/autodl-tmp/outputs/HTL-ReID/E042_T12_peak_warmstart_seed1111/HTL-ReID_best.pth'
  HS_ENABLED: 1
  HS_RATIO: 0.0078125
  HS_LEARNABLE_K: 0
  HS_BUDGET_LOSS_WEIGHT: 0.0
  HS_RESIDUAL_TOKEN: 0
  FREQUENCY_ENABLED: 1
  QUALITY_AWARE: 0
  SELECTED_PATCH_BLEND_WEIGHT: 0.0

  ACI: 1
  ACI_USE_SCORES: 0
  ACI_USE_MASKS: 1
  ACI_NUM_HEADS: 12
  ACI_STEPS: 3
  ACI_SCORE_BIAS_SCALE: 0.0
  ACI_SCORE_FLOOR: 0.05
  ACI_DETACH_SCORES: 1
  ACI_GATE_INIT_BIAS: 0.0
  ACI_INDEPENDENT_AGG: 0
  ACI_SELF_REFINE: 0
  ACI_ROUTE_BALANCE_WEIGHT: 0.0

  CROSS_MODAL_RECON_ENABLED: 0
  CROSS_MODAL_RECON_LOSS_WEIGHT: 0.0
  HETERO_TRIPLET_WEIGHT: 0.0
  BCC_LOSS_WEIGHT: 0.0
  AUX_LOSS_WEIGHT: 0.0

  DECOUPLED_MOE: 0
  DECOUPLED_MOE_NUM_HEADS: 12
  DECOUPLED_MOE_GATE_HEADS: 4
  DECOUPLED_MOE_DROPOUT: 0.1
  DECOUPLED_MOE_LOSS_WEIGHT: 1.0

  PART_BRANCH: 1
  PART_NUM: 3
  PART_POOL: 'stripe'
  FUSE_LOSS_WEIGHT: 1.0
  BRANCH_LOSS_WEIGHT: 0.5
  PART_LOSS_WEIGHT: 0.15

SOLVER:
  IMS_PER_BATCH: 64
  BASE_LR: 0.0001
  BACKBONE_LR_FACTOR: 0.1
  NEW_MODULE_LR_FACTOR: 1.0
  DECOUPLED_MOE_LR_FACTOR: 3.5
  MAX_EPOCHS: 50
  TRAIN_EPOCHS: 50
  WARMUP_ITERS: 10
  STRICT_DETERMINISM: 0
  TARGET_MAP: 0.737
  TARGET_RANK1: 0.805

TEST:
  RE_RANKING: 'no'
  PART_FEAT: 'concat'
  PART_FEAT_WEIGHT: 0.3
  ORIGINAL_CLS_FEAT: 'concat'
  ORIGINAL_CLS_FEAT_WEIGHT: 0.5
  DECOUPLED_MOE_FEAT: 'off'
  DECOUPLED_MOE_FEAT_WEIGHT: 0.0
