# A0: strong shared ViT-B/16 backbone baseline.
# Keep all patch tokens, concatenate RGB/NIR/TIR cls descriptors, and disable
# quality/fusion/adapter/part auxiliary modules.
MODEL:
  SELECTED_PATCH_BLEND_WEIGHT: 0.0
  SELECTED_PATCH_CONTEXT: 'mean'
  FREQUENCY_QUALITY_AWARE: 0
  QUALITY_AWARE: 0
  MODALITY_ADAPTER: 0
  PART_BRANCH: 0
  ALIGN_LOSS_WEIGHT: 0.0
  TOKEN_CONSISTENCY_WEIGHT: 0.0
  GATE_BALANCE_WEIGHT: 0.0
  QUALITY_PERTURB_LOSS_WEIGHT: 0.0
  AUX_LOSS_WEIGHT: 0.0
INPUT:
  MODALITY_DROP_PROB: 0.0
DATALOADER:
  NUM_INSTANCE: 8
SOLVER:
  IMS_PER_BATCH: 40
  MAX_EPOCHS: 120
  TRAIN_EPOCHS: 20
TEST:
  PART_FEAT: 'off'
