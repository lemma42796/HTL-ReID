# A5: A4 + conservatively warmed part branch and auxiliary losses.
MODEL:
  SELECTED_PATCH_BLEND_WEIGHT: 0.15
  SELECTED_PATCH_CONTEXT: 'mean'
  SELECTED_PATCH_ATTN_SCALE: 10.0
  SELECTED_PATCH_GATE_INIT: 0.0
  FREQUENCY_QUALITY_AWARE: 1
  QUALITY_AWARE: 1
  MODALITY_ADAPTER: 1
  MODALITY_ADAPTER_SCALE: 0.25
  PART_BRANCH: 1
  PART_POOL: 'stripe'
  ALIGN_LOSS_WEIGHT: 0.05
  TOKEN_CONSISTENCY_WEIGHT: 0.01
  GATE_BALANCE_WEIGHT: 0.0
  QUALITY_PERTURB_LOSS_WEIGHT: 0.01
  PART_LOSS_WEIGHT: 0.25
  AUX_LOSS_WEIGHT: 0.3
  AUX_WARMUP_EPOCHS: 40
INPUT:
  MODALITY_DROP_PROB: 0.0
DATALOADER:
  NUM_INSTANCE: 8
SOLVER:
  IMS_PER_BATCH: 40
  MAX_EPOCHS: 120
  TRAIN_EPOCHS: 20
TEST:
  PART_FEAT: 'off'
  PART_FEAT_WEIGHT: 0.3
