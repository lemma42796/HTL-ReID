# A1-HMA: A1 token selection plus masked selected-token aggregation.
# This keeps quality/AGF/adapter/part off so the row tests whether selected
# tokens become useful once a HMA-like aggregation block consumes them.
MODEL:
  SELECTED_PATCH_BLEND_WEIGHT: 0.0
  SELECTED_PATCH_CONTEXT: 'mean'
  SELECTED_PATCH_ATTN_SCALE: 10.0
  SELECTED_PATCH_GATE_INIT: 0.0
  SELECTED_AGGREGATION: 1
  SELECTED_AGG_NUM_HEADS: 12
  SELECTED_AGG_GATE_INIT_BIAS: -2.0
  SELECTED_AGG_RESIDUAL_WEIGHT: 0.5
  FREQUENCY_QUALITY_AWARE: 0
  QUALITY_AWARE: 0
  MODALITY_ADAPTER: 0
  PART_BRANCH: 0
  ALIGN_LOSS_WEIGHT: 0.0
  TOKEN_CONSISTENCY_WEIGHT: 0.0
  GATE_BALANCE_WEIGHT: 0.0
  QUALITY_PERTURB_LOSS_WEIGHT: 0.0
  AUX_LOSS_WEIGHT: 0.0
INPUT:
  MODALITY_DROP_PROB: 0.0
DATALOADER:
  NUM_INSTANCE: 8
SOLVER:
  IMS_PER_BATCH: 40
  MAX_EPOCHS: 120
  TRAIN_EPOCHS: 20
TEST:
  PART_FEAT: 'off'
