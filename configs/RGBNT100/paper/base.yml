# RGBNT100 paper protocol. The official vehicle split is used with the
# DeMo-family training contract: landscape input, 16 samples per identity,
# batch 128, Adam, 50 epochs, and no re-ranking.
MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH_T: '/root/autodl-tmp/pretrained/vit_base_patch16_224_augreg2_in21k_ft_in1k.pth'
  RESUME_PATH: ''
  TRANSFORMER_TYPE: 'vit_base_patch16_224'
  STRIDE_SIZE: [16, 16]
  SIE_CAMERA: True
  SIE_VIEW: False
  SIE_COE: 1.0
  DIST_TRAIN: False
  AL: 1

  HS_LAYERS: [4, 8, 12]
  HS_K: 16
  FACSS_K: 16
  FACSS_DYNAMIC_K: 1
  FACSS_MIN_K: 8
  FACSS_MAX_K: 32
  FACSS_K_HIDDEN: 192
  FACSS_SOFT_RESIDUAL_WEIGHT: 0.15
  FACSS_ALPHA_HIDDEN: 192
  FACSS_CROSS_POOL: 'max'
  FACSS_ALPHA_GRANULARITY: 'sample'
  FACSS_NORM: 'minmax'
  FACSS_STE: 1
  FACSS_STE_TAU: 1.0
  FACSS_MODALITY_UNION: 1
  FACSS_UNION_PROMOTE: 1
  SELECTED_PATCH_CONTEXT: 'mean'
  SELECTED_PATCH_ATTN_SCALE: 10.0
  SELECTED_PATCH_GATE_INIT: 0.0
  SELECTED_AGGREGATION: 0
  SFTS_RESIDUAL_TOKEN: 0

  FREQUENCY_ENABLED: 0
  FREQUENCY_QUALITY_AWARE: 0
  OCFR: 0
  AGF: 0
  TPM: 0
  FACR: 0
  FACR_INDEPENDENT_AGG: 0
  FACR_SELF_REFINE: 0
  FACR_SELF_REFINE_SCALE_INIT: 0.1
  FACR_ROUTE_BALANCE_WEIGHT: 0.0
  CROSS_MODAL_RECON_ENABLED: 0
  CROSS_MODAL_RECON_HIDDEN_DIM: 256
  CROSS_MODAL_RECON_LOSS_WEIGHT: 0.0
  MODALITY_ADAPTER: 0
  PART_BRANCH: 0
  ALIGN_LOSS_WEIGHT: 0.0
  TOKEN_CONSISTENCY_WEIGHT: 0.0
  BCC_LOSS_WEIGHT: 0.0
  GATE_BALANCE_WEIGHT: 0.0
  QUALITY_PERTURB_LOSS_WEIGHT: 0.0
  AUX_LOSS_WEIGHT: 0.0

INPUT:
  SIZE_TRAIN: [128, 256]
  SIZE_TEST: [128, 256]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  GRAY_REPLACE_PROB: 0.0
  MODALITY_DROP_PROB: 0.0

DATASETS:
  NAMES: 'RGBNT100'
  ROOT_DIR: '/root/autodl-tmp/datasets'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 16
  NUM_WORKERS: 14

SOLVER:
  OPTIMIZER_NAME: 'Adam'
  BASE_LR: 0.00035
  # DeMo's released optimizer uses a 0.8x encoder LR for ImageNet ViT while
  # keeping newly initialized fusion modules at the base learning rate.
  BACKBONE_LR_FACTOR: 0.8
  NEW_MODULE_LR_FACTOR: 1.0
  DECOUPLED_MOE_LR_FACTOR: 1.0
  WEIGHT_DECAY: 0.0001
  WEIGHT_DECAY_BIAS: 0.0001
  WARMUP_FACTOR: 0.1
  WARMUP_ITERS: 10
  SCHEDULER_UNIT: 'epoch'
  IMS_PER_BATCH: 128
  MAX_EPOCHS: 50
  TRAIN_EPOCHS: 50
  SEED: 1111
  STRICT_DETERMINISM: 0
  EVAL_PERIOD: 1
  SAVE_BEST_CHECKPOINT: True
  SAVE_PERIODIC_CHECKPOINTS: False

TEST:
  IMS_PER_BATCH: 128
  RE_RANKING: 'no'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  PART_FEAT: 'off'

OUTPUT_DIR: '/root/autodl-tmp/outputs/HTL-ReID'
